
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My iPhone</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#222;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh
}
.phone{
 width:min(390px,100vw);height:min(844px,100dvh);
 min-height:560px;background:#111;border:5px solid #444;
 border-radius:42px;overflow:hidden;position:relative
}
.wallpaper{
 position:absolute;inset:0;
 background-image:url('./687AE8AE-4216-4825-9BC5-F094C56021B6.jpeg');
 background-size:cover;background-position:center;
 background-repeat:no-repeat
}
.status{
 position:absolute;top:0;left:0;right:0;height:52px;
 padding:17px 24px 0;display:flex;align-items:center;
 justify-content:space-between;color:white;
 font-size:15px;font-weight:600;z-index:5;
 pointer-events:none
}
.status-right{display:flex;align-items:center;gap:6px}
.battery{
 width:27px;height:13px;border:1.5px solid white;
 border-radius:4px;position:relative;margin-left:2px
}
.battery:before{
 content:"";position:absolute;left:2px;top:2px;
 height:7px;width:18px;background:white;border-radius:1px
}
.battery:after{
 content:"";position:absolute;right:-4px;top:3px;
 height:5px;width:2px;background:white;border-radius:0 2px 2px 0
}
.lock{
 position:absolute;inset:52px 0 0;text-align:center;
 padding-top:55px;cursor:pointer;z-index:2
}
.date{font-size:17px;margin-bottom:8px;text-shadow:0 1px 5px #333}
.clock{
 font-size:40px;font-weight:500;letter-spacing:-4px;
 text-shadow:0 1px 5px #333
}
.lock-hint{
 position:absolute;bottom:48px;left:0;right:0;
 font-size:14px;text-shadow:0 1px 5px #333
}
.home{
 position:absolute;inset:52px 0 0;padding:24px 18px 115px;
 display:none;z-index:2
}
.widgets{
 position:absolute;top:90px;right:18px;
 width:92px;height:112px;border-radius:22px;
 background:#ffffff30;border:1px solid #ffffff35;
 padding:12px 10px;backdrop-filter:blur(12px);
 margin:0;text-shadow:0 1px 4px #333;
}
.widgets small{font-size:10px}
.widgets h2{font-size:21px;margin:8px 0}
.widgets span{font-size:11px}
.grid{
 position:absolute;
 top:300px;
 left:18px;
 right:18px;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 grid-template-rows:auto auto;
 gap:18px 7px;
}
.grid .app:nth-child(1){grid-column:1;grid-row:1}
.grid .app:nth-child(2){grid-column:1;grid-row:2}
.grid .app:nth-child(3){grid-column:2;grid-row:2}
.grid .app:nth-child(4){grid-column:3;grid-row:2}
.grid .app:nth-child(5){grid-column:4;grid-row:2}
.app{
 border:0;background:none;color:white;text-align:center;
 font-size:11px;cursor:pointer;padding:0;min-width:0;
}
.icon{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#fff;
  color:#222;
  margin:0 auto 6px;
  display:grid;
  place-items:center;
  font-size:32px;
  box-shadow:0 2px 6px #0002;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:inherit;
  display:block;
}
.dock{
 position:absolute;bottom:20px;left:14px;right:14px;
 height:82px;border-radius:28px;
 background:#ffffff40;border:1px solid #ffffff25;
 backdrop-filter:blur(18px);
 display:flex;align-items:center;justify-content:space-evenly;
}
.dock .icon{width:58px;height:58px;margin:0}
.page{
 position:absolute;inset:0;background:#f7f7fa;color:#222;
 display:none;padding:65px 20px 35px;overflow:auto;z-index:4
}
.page h2{font-size:27px;margin:18px 0}
.back{
 border:0;border-radius:12px;padding:10px 14px;
 background:#e4e4eb;color:#222;font-size:15px
}
.row{padding:16px 0;border-bottom:1px solid #ddd}
.page textarea,.page input{
 width:100%;padding:13px;border:1px solid #ddd;
 border-radius:12px;font-size:16px
}
.page textarea{height:260px}
.homebar{
 position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
 width:120px;height:5px;border-radius:9px;
 background:white;z-index:6;cursor:pointer
}
</style>
</head>
<body>
<div class="phone">
<div class="wallpaper"></div>

<div class="status">
 <span id="statusTime">5:31</span>
 <div class="status-right">
  <svg width="27" height="18" viewBox="0 0 27 18">
   <path d="M2 16V12 M8 16V9 M14 16V5 M20 16V1"
   stroke="white" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <svg width="27" height="20" viewBox="0 0 27 20">
   <path d="M2 6 Q13.5 -2 25 6 M6 11 Q13.5 5 21 11 M10 15 Q13.5 12 17 15"
   fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
   <circle cx="13.5" cy="18" r="1.5" fill="white"/>
  </svg>
  <span class="battery"></span>
 </div>
</div>

<div class="lock" id="lock" onclick="goHome()">
 <div class="date" id="date"></div>
 <div class="clock" id="clock">5:31</div>
 <div class="lock-hint">탭하여 iPhone 열기 ↑</div>
</div>
<div class="home" id="home">
  <div class="widgets">
    <small>♡</small>
    <h2>713일</h2>
    <span></span>
  </div>

  <div class="grid">
    <button class="app" onclick="openApp('Safari')">
      <div class="icon"><img src="./IMG_7065.jpeg" alt="Safari"></div>
      Safari
    </button>
    <button class="app" onclick="openApp('Instagram')">
      <div class="icon"><img src="./IMG_7069.jpeg" alt="Instagram"></div>
      Instagram
    </button>
    <button class="app" onclick="openApp('시계')">
      <div class="icon"><img src="./IMG_7066.jpeg" alt="시계"></div>
      시계
    </button>
    <button class="app" onclick="openApp('캘린더')">
      <div class="icon"><img src="./IMG_7070.jpeg" alt="캘린더"></div>
      캘린더
    </button>
    <button class="app" onclick="openApp('메모')">
      <div class="icon"><img src="./IMG_7068.jpeg" alt="메모"></div>
      메모
    </button>
  </div>

  <div class="dock">
    <button class="app" onclick="openApp('전화')">
      <div class="icon"><img src="./IMG_7072.jpeg" alt="전화"></div>
    </button>
    <button class="app" onclick="openApp('메시지')">
      <div class="icon"><img src="./IMG_7067.jpeg" alt="메시지"></div>
    </button>
    <button class="app" onclick="openApp('사진')">
      <div class="icon"><img src="./IMG_7064.jpeg" alt="사진"></div>
    </button>
    <button class="app" onclick="openApp('카카오톡')">
      <div class="icon"><img src="./IMG_7071.jpeg" alt="카카오톡"></div>
    </button>
  </div>
</div>

<div class="page" id="page">
 <button class="back" onclick="goHome()">‹ 홈 화면</button>
 <div id="pageContent"></div>
</div>
<div class="homebar" onclick="goHome()"></div>
</div>

<script>
let touchStartY = 0;

document.getElementById('lock').addEventListener('touchstart', function(e) {
  touchStartY = e.changedTouches[0].clientY;
}, {passive: true});

document.getElementById('lock').addEventListener('touchend', function(e) {
  const touchEndY = e.changedTouches[0].clientY;
  if (touchStartY - touchEndY > 50) {
    goHome();
  }
}, {passive: true});
 function goHome(){
 document.getElementById('lock').style.display='none';
 document.getElementById('page').style.display='none';
 document.getElementById('home').style.display='block';
}
let photoIndex = 0;
const photoFiles = ['IMG_6386.jpeg','IMG_6407.jpeg','IMG_6558.jpeg','IMG_6559.jpeg','IMG_6707.png','IMG_6718.png','IMG_6892.jpeg','IMG_6893.jpeg','IMG_6934.jpeg','IMG_6937.jpeg'];

function openPhotoViewer(i){
  photoIndex = i;
  showPhoto();
}

function showPhoto(){
  let v = document.getElementById('photoViewer');
  if(!v){
    v = document.createElement('div');
    v.id = 'photoViewer';
    v.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;color:white';
    document.body.appendChild(v);
  }
  v.style.display = 'flex';
  v.innerHTML = '<button onclick="document.getElementById(\'photoViewer\').style.display=\'none\'" style="position:absolute;top:25px;left:20px;color:white;background:none;border:0;font-size:32px">×</button><button onclick="movePhoto(-1)" style="position:absolute;left:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">‹</button><img src="'+photoFiles[photoIndex]+'" style="max-width:90%;max-height:80%;object-fit:contain"><button onclick="movePhoto(1)" style="position:absolute;right:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">›</button><div style="position:absolute;bottom:25px">'+(photoIndex+1)+' / '+photoFiles.length+'</div>';
  let startX = 0;
  v.ontouchstart = e => startX = e.touches[0].clientX;
  v.ontouchend = e => {
    let dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx)>50) movePhoto(dx<0?1:-1);
  };
}

function movePhoto(n){
  photoIndex = (photoIndex+n+photoFiles.length)%photoFiles.length;
  showPhoto();
}
 function openApp(name){
 const page=document.getElementById('page');
 const content=document.getElementById('pageContent');
 document.getElementById('lock').style.display='none';
 document.getElementById('home').style.display='none';
 page.style.display='block';
 let html='';
 if(name==='메시지'){
  html='<h2>메시지</h2><div class="row">메시지가 없습니다</div>';
 }else if(name==='사진'){
  html='<h2>사진</h2><div style="color:#888;margin:8px 0 16px">앨범</div><div onclick="this.nextElementSibling.style.display=\'grid\'" style="display:flex;align-items:center;gap:14px;padding:12px;background:#f4f4f4;border-radius:14px;cursor:pointer"><img src="IMG_6934.jpeg" style="width:82px;height:82px;object-fit:cover;border-radius:10px"><div style="flex:1"><b style="font-size:17px;color:#222">형</b><div style="font-size:13px;color:#888;margin-top:5px">사진 10장</div></div><span style="color:#aaa;font-size:22px">›</span></div><div style="display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:14px">'+["IMG_6386.jpeg","IMG_6407.jpeg","IMG_6558.jpeg","IMG_6559.jpeg","IMG_6707.png","IMG_6718.png","IMG_6892.jpeg","IMG_6893.jpeg","IMG_6934.jpeg","IMG_6937.jpeg"].map((src,i)=>'<img src="'+src+'" onclick="openPhotoViewer('+i+')" style="width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer">').join('')+'</div>';
 }else if(name==='카메라'){
  html='<h2>카메라</h2><div style="height:280px;background:#222;border-radius:20px;display:grid;place-items:center;color:white;font-size:50px">📷</div>';
 }else if(name==='설정'){
  html='<h2>설정</h2><div class="row">✈️ 에어플레인 모드</div><div class="row">Wi-Fi</div><div class="row">Bluetooth</div><div class="row">알림</div><div class="row">디스플레이 및 밝기</div>';
 }else if(name==='메모'){
  html='<h2>메모</h2><textarea placeholder="메모를 입력하세요..."></textarea>';
 }else if(name==='전화'){
  html='<h2>전화</h2><div style="font-size:40px;text-align:center;margin:35px">📞</div><p style="text-align:center">즐겨찾기　최근 통화　연락처</p><input placeholder="번호 입력">';
 }else if(name==='캘린더'){
  html='<h2>캘린더</h2><p>'+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'</p><div class="row">오늘</div>';
 }else{
  html='<h2>Safari</h2><div style="display:flex;justify-content:space-around;background:#fff;border-radius:40px;padding:18px 5px;margin:20px 0;font-size:26px"><span>▦</span><span>♧</span><span>◎</span><span>◷</span></div><h3>즐겨찾기</h3><div style="display:flex;justify-content:space-around;text-align:center;margin:25px 0"><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.apple.com\'">🍎<br>Apple</div><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.bing.com\'">🔷<br>Bing</div><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.google.com\'">🌐<br>Google</div></div><h3>최근 검색</h3><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 데이트 맛집 추천\'">🕘 제주도 데이트 맛집 추천</div><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 분위기 좋은 맛집\'">🕘 제주도 분위기 좋은 맛집</div><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 커플 여행 코스\'">🕘 제주도 커플 여행 코스</div><input id="safariSearch" placeholder="검색 또는 웹사이트 입력" style="width:100%;padding:14px;border-radius:20px;border:1px solid #ddd;font-size:16px;box-sizing:border-box;margin-top:20px">';

 }
 content.innerHTML=html;
}
function updateClock(){
 const now=new Date();
 let hours=now.getHours()%12;
 if(hours===0)hours=12;
 const time=hours+':'+String(now.getMinutes()).padStart(2,'0');
 document.getElementById('clock').textContent=time;
 document.getElementById('statusTime').textContent=time;
 document.getElementById('date').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
 document.getElementById('widgetDate').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
}
updateClock();
setInterval(updateClock,30000);
</script>
</body>
</html>
