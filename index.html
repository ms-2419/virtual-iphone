<style>
*{box-sizing:border-box}
body{
 margin:0;background:#222;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh
}
.phone{
 width:min(390px,100vw);height:min(844px,100dvh);
 min-height:560px;background:#111;border:5px solid #444;
 border-radius:42px;overflow:hidden;position:relative
}
.wallpaper{
 position:absolute;inset:0;
 background-image:url('./687AE8AE-4216-4825-9BC5-F094C56021B6.jpeg');
 background-size:cover;background-position:center;
 background-repeat:no-repeat
}
.status{
 position:absolute;top:0;left:0;right:0;height:52px;
 padding:17px 24px 0;display:flex;align-items:center;
 justify-content:space-between;color:white;
 font-size:15px;font-weight:600;z-index:5;
 pointer-events:none
}
.status-right{display:flex;align-items:center;gap:6px}
.battery{
 width:27px;height:13px;border:1.5px solid white;
 border-radius:4px;position:relative;margin-left:2px
}
.battery:before{
 content:"";position:absolute;left:2px;top:2px;
 height:7px;width:18px;background:white;border-radius:1px
}
.battery:after{
 content:"";position:absolute;right:-4px;top:3px;
 height:5px;width:2px;background:white;border-radius:0 2px 2px 0
}
.lock{
 position:absolute;inset:52px 0 0;text-align:center;
 padding-top:55px;cursor:pointer;z-index:2
}
.date{font-size:17px;margin-bottom:8px;text-shadow:0 1px 5px #333}
.clock{
 font-size:40px;font-weight:500;letter-spacing:-4px;
 text-shadow:0 1px 5px #333
}
.lock-hint{
 position:absolute;bottom:48px;left:0;right:0;
 font-size:14px;text-shadow:0 1px 5px #333
}
.home{
 position:absolute;inset:52px 0 0;padding:24px 18px 115px;
 display:none;z-index:2
}
.widgets{
 position:absolute;top:90px;right:18px;
 width:92px;height:112px;border-radius:22px;
 background:#ffffff30;border:1px solid #ffffff35;
 padding:12px 10px;backdrop-filter:blur(12px);
 margin:0;text-shadow:0 1px 4px #333;
}
.widgets small{font-size:10px}
.widgets h2{font-size:21px;margin:8px 0}
.widgets span{font-size:11px}
.grid{
 position:absolute;
 top:300px;
 left:18px;
 right:18px;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 grid-template-rows:auto auto;
 gap:18px 7px;
}
.grid .app:nth-child(1){grid-column:1;grid-row:1}
.grid .app:nth-child(2){grid-column:1;grid-row:2}
.grid .app:nth-child(3){grid-column:2;grid-row:2}
.grid .app:nth-child(4){grid-column:3;grid-row:2}
.grid .app:nth-child(5){grid-column:4;grid-row:2}
.app{
 border:0;background:none;color:white;text-align:center;
 font-size:11px;cursor:pointer;padding:0;min-width:0;
}
.icon{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#fff;
  color:#222;
  margin:0 auto 6px;
  display:grid;
  place-items:center;
  font-size:32px;
  box-shadow:0 2px 6px #0002;
}
.icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:inherit;
  display:block;
}
.dock{
 position:absolute;bottom:20px;left:14px;right:14px;
 height:82px;border-radius:28px;
 background:#ffffff40;border:1px solid #ffffff25;
 backdrop-filter:blur(18px);
 display:flex;align-items:center;justify-content:space-evenly;
}
.dock .icon{width:58px;height:58px;margin:0}
.page{
 position:absolute;inset:0;background:#f7f7fa;color:#222;
 display:none;padding:50px 16px 65px;overflow:hidden;z-index:4
}
.page h2{font-size:27px;margin:18px 0}
.back{
 border:0;border-radius:12px;padding:8px 12px;
 background:#e4e4eb;color:#222;font-size:14px;margin-bottom:10px
}
.row{padding:10px 0;border-bottom:1px solid #eee}
.homebar{
 position:absolute;bottom:8px;left:50%;transform:translateY(-50%);
 width:120px;height:5px;border-radius:9px;
 background:white;z-index:10;cursor:pointer
}

<script>
let touchStartY = 0;

document.getElementById('lock').addEventListener('touchstart', function(e) {
  touchStartY = e.changedTouches[0].clientY;
}, {passive: true});

document.getElementById('lock').addEventListener('touchend', function(e) {
  const touchEndY = e.changedTouches[0].clientY;
  if (touchStartY - touchEndY > 50) {
    goHome();
  }
}, {passive: true});

function goHome(){
  document.getElementById('lock').style.display='none';
  document.getElementById('page').style.display='none';
  document.getElementById('home').style.display='block';
}

let photoIndex = 0;
const photoFiles = ['IMG_6386.jpeg','IMG_6407.jpeg','IMG_6558.jpeg','IMG_6559.jpeg','IMG_6707.png','IMG_6718.png','IMG_6892.jpeg','IMG_6893.jpeg','IMG_6934.jpeg','IMG_6937.jpeg'];

function openPhotoViewer(i){
  photoIndex = i;
  showPhoto();
}

function showPhoto(){
  let v = document.getElementById('photoViewer');
  if(!v){
    v = document.createElement('div');
    v.id = 'photoViewer';
    v.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;color:white';
    document.body.appendChild(v);
  }
  v.style.display = 'flex';
  v.innerHTML = '<button onclick="document.getElementById(\'photoViewer\').style.display=\'none\'" style="position:absolute;top:25px;left:20px;color:white;background:none;border:0;font-size:32px">×</button><button onclick="movePhoto(-1)" style="position:absolute;left:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">‹</button><img src="'+photoFiles[photoIndex]+'" style="max-width:90%;max-height:80%;object-fit:contain"><button onclick="movePhoto(1)" style="position:absolute;right:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">›</button><div style="position:absolute;bottom:25px">'+(photoIndex+1)+' / '+photoFiles.length+'</div>';
  let startX = 0;
  v.ontouchstart = e => startX = e.touches[0].clientX;
  v.ontouchend = e => {
    let dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx)>50) movePhoto(dx<0?1:-1);
  };
}

function movePhoto(n){
  photoIndex = (photoIndex+n+photoFiles.length)%photoFiles.length;
  showPhoto();
}

window.igSlideState = {};
window.igMoveSlide = function(postId, direction) {
  if (window.igSlideState[postId] === undefined) window.igSlideState[postId] = 0;
  window.igSlideState[postId] = (window.igSlideState[postId] + direction + 2) % 2;
  const idx = window.igSlideState[postId];
  const imgEl = document.getElementById('slideImg_' + postId);
  const dot0 = document.getElementById('dot_' + postId + '_0');
  const dot1 = document.getElementById('dot_' + postId + '_1');
  const postArr = window.igFeedPosts[postId];
  if (imgEl && Array.isArray(postArr)) imgEl.src = './' + postArr[idx];
  if (dot0 && dot1) {
    dot0.style.background = idx === 0 ? '#3797f0' : '#ccc';
    dot1.style.background = idx === 1 ? '#3797f0' : '#ccc';
  }
};

window.changeCalMonth = function(dir) {
  window.calMonth += dir;
  if (window.calMonth > 11) {
    window.calMonth = 0;
    window.calYear++;
  } else if (window.calMonth < 0) {
    window.calMonth = 11;
    window.calYear--;
  }
  if (window.calYear < 2022) { window.calYear = 2022; window.calMonth = 0; }
  if (window.calYear > 2026 || (window.calYear === 2026 && window.calMonth > 9)) { window.calYear = 2026; window.calMonth = 9; }
  renderCalendar();
};

window.renderCalendar = function() {
  const y = window.calYear;
  const m = window.calMonth;
  const titleEl = document.getElementById('calTitle');
  const gridEl = document.getElementById('calGrid');
  if(!titleEl || !gridEl) return;

  titleEl.textContent = `${y}년 ${m+1}월`;

  const firstDay = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m+1, 0).getDate();

  let html = '';
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  weekdays.forEach(wd => {
    html += `<div style="text-align:center;font-size:12px;color:#888;font-weight:600;padding-bottom:6px">${wd}</div>`;
  });

  for(let i=0; i<firstDay; i++) {
    html += `<div></div>`;
  }

  for(let d=1; d<=lastDate; d++) {
    const key = `${y}-${m+1}-${d}`;
    const memo = window.calMemos[key];
    const isToday = (y === 2026 && m === 9 && d === 19);

    if (memo) {
      html += `
        <div onclick="alert('${y}년 ${m+1}월 ${d}일 일정:\\n${memo}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#ff3b3015;border-radius:50%;position:relative">
          <span style="font-size:13px;font-weight:600;color:#ff3b30">${d}</span>
          <span style="width:4px;height:4px;background:#ff3b30;border-radius:50%;margin-top:2px"></span>
        </div>`;
    } else if (isToday) {
      html += `
        <div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#ff3b30;color:white;border-radius:50%;font-size:13px;font-weight:600">
          ${d}
        </div>`;
    } else {
      html += `
        <div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#111">
          ${d}
        </div>`;
    }
  }
  gridEl.innerHTML = html;
};

        <div style="position:absolute;bottom:0;left:-20px;right:-20px;height:55px;background:#f1f1f3;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:#888;z-index:5">
          <div style="text-align:center">🌐<div style="margin-top:2px">세계 시계</div></div>
          <div style="text-align:center;color:#ff9f0a">⏰<div style="margin-top:2px">알람</div></div>
          <div style="text-align:center">⏱️<div style="margin-top:2px">스톱워치</div></div>
          <div style="text-align:center">⏳<div style="margin-top:2px">타이머</div></div>
        </div>
      </div>
    `;
    content.innerHTML=html;
  }else{
    html='<h2>Safari</h2><div style="display:flex;justify-content:space-around;background:#fff;border-radius:40px;padding:18px 5px;margin:20px 0;font-size:26px"><span>▦</span><span>♧</span><span>◎</span><span>◷</span></div><h3>즐겨찾기</h3><div style="display:flex;justify-content:space-around;text-align:center;margin:25px 0"><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.apple.com\'">🍎<br>Apple</div><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.bing.com\'">🔷<br>Bing</div><div onclick="document.getElementById(\'safariSearch\').value=\'https://www.google.com\'">🌐<br>Google</div></div><h3>최근 검색</h3><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 데이트 맛집 추천\'"> 제주도 데이트 맛집 추천</div><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 분위기 좋은 맛집\'"> 제주도 분위기 좋은 맛집</div><div class="row" onclick="document.getElementById(\'safariSearch\').value=\'제주도 커플 여행 코스\'"> 제주도 커플 여행 코스</div><input id="safariSearch" placeholder="검색 또는 웹사이트 입력" style="width:100%;padding:14px;border-radius:20px;border:1px solid #ddd;font-size:16px;box-sizing:border-box;margin-top:20px">';
    content.innerHTML=html;
  }
}

function updateClock(){
  const now=new Date();
  let hours=now.getHours()%12;
  if(hours===0)hours=12;
  const time=hours+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=time;
  document.getElementById('statusTime').textContent=time;
  document.getElementById('date').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
updateClock();
setInterval(updateClock,30000);
</script>
