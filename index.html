<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My iPhone</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#222;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh
}
.phone{
 width:min(390px,100vw);height:min(844px,100dvh);
 min-height:560px;background:#111;border:5px solid #444;
 border-radius:42px;overflow:hidden;position:relative
}
.wallpaper{
 position:absolute;inset:0;
 background-image:url('./687AE8AE-4216-4825-9BC5-F094C56021B6.jpeg');
 background-size:cover;background-position:center;
 background-repeat:no-repeat
}
.status{
 position:absolute;top:0;left:0;right:0;height:52px;
 padding:17px 24px 0;display:flex;align-items:center;
 justify-content:space-between;color:white;
 font-size:15px;font-weight:600;z-index:5;
 pointer-events:none
}
.status-right{display:flex;align-items:center;gap:6px}
.battery{
 width:27px;height:13px;border:1.5px solid white;
 border-radius:4px;position:relative;margin-left:2px
}
.battery:before{
 content:"";position:absolute;left:2px;top:2px;
 height:7px;width:18px;background:white;border-radius:1px
}
.battery:after{
 content:"";position:absolute;right:-4px;top:3px;
 height:5px;width:2px;background:white;border-radius:0 2px 2px 0
}
.lock{
 position:absolute;inset:52px 0 0;text-align:center;
 padding-top:55px;cursor:pointer;z-index:2
}
.date{font-size:17px;margin-bottom:8px;text-shadow:0 1px 5px #333}
.clock{
 font-size:40px;font-weight:500;letter-spacing:-4px;
 text-shadow:0 1px 5px #333
}
.lock-hint{
 position:absolute;bottom:48px;left:0;right:0;
 font-size:14px;text-shadow:0 1px 5px #333
}
.home{
 position:absolute;inset:52px 0 0;padding:24px 18px 115px;
 display:none;z-index:2
}
.widgets{
 position:absolute;top:90px;right:18px;
 width:92px;height:112px;border-radius:22px;
 background:#ffffff30;border:1px solid #ffffff35;
 padding:12px 10px;backdrop-filter:blur(12px);
 margin:0;text-shadow:0 1px 4px #333;
}
.widgets small{font-size:10px}
.widgets h2{font-size:21px;margin:8px 0}
.widgets span{font-size:11px}
.grid{
 position:absolute;
 top:300px;
 left:18px;
 right:18px;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 grid-template-rows:auto auto;
 gap:18px 7px;
}
.grid .app:nth-child(1){grid-column:1;grid-row:1}
.grid .app:nth-child(2){grid-column:1;grid-row:2}
.grid .app:nth-child(3){grid-column:2;grid-row:2}
.grid .app:nth-child(4){grid-column:3;grid-row:2}
.grid .app:nth-child(5){grid-column:4;grid-row:2}
.app{
 border:0;background:none;color:white;text-align:center;
 font-size:11px;cursor:pointer;padding:0;min-width:0;
}
.icon{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#fff;
  color:#222;
  margin:0 auto 6px;
  display:grid;
  place-items:center;
  font-size:32px;
  box-shadow:0 2px 6px #0002;
}
.icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:inherit;
  display:block;
}
.dock{
 position:absolute;bottom:20px;left:14px;right:14px;
 height:82px;border-radius:28px;
 background:#ffffff40;border:1px solid #ffffff25;
 backdrop-filter:blur(18px);
 display:flex;align-items:center;justify-content:space-evenly;
}
.dock .icon{width:58px;height:58px;margin:0}
.page{
 position:absolute;inset:0;background:#f7f7fa;color:#222;
 display:none;padding:65px 20px 35px;overflow:auto;z-index:4
}
.page h2{font-size:27px;margin:18px 0}
.back{
 border:0;border-radius:12px;padding:10px 14px;
 background:#e4e4eb;color:#222;font-size:15px
}
.row{padding:16px 0;border-bottom:1px solid #ddd}
.page textarea,.page input{
 width:100%;padding:13px;border:1px solid #ddd;
 border-radius:12px;font-size:16px
}
.page textarea{height:260px}
.homebar{
 position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
 width:120px;height:5px;border-radius:9px;
 background:white;z-index:6;cursor:pointer
}
</style>
</head>

<script>
let touchStartY = 0;

document.getElementById('lock').addEventListener('touchstart', function(e) {
  touchStartY = e.changedTouches[0].clientY;
}, {passive: true});

document.getElementById('lock').addEventListener('touchend', function(e) {
  const touchEndY = e.changedTouches[0].clientY;
  if (touchStartY - touchEndY > 50) {
    goHome();
  }
}, {passive: true});

function goHome(){
  document.getElementById('lock').style.display='none';
  document.getElementById('page').style.display='none';
  document.getElementById('home').style.display='block';
}

let photoIndex = 0;
const photoFiles = ['IMG_6386.jpeg','IMG_6407.jpeg','IMG_6558.jpeg','IMG_6559.jpeg','IMG_6707.png','IMG_6718.jpeg','IMG_6892.jpeg','IMG_6893.jpeg','IMG_6934.jpeg','IMG_6937.jpeg'];

function openPhotoViewer(i){
  photoIndex = i;
  showPhoto();
}

function showPhoto(){
  let v = document.getElementById('photoViewer');
  if(!v){
    v = document.createElement('div');
    v.id = 'photoViewer';
    v.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;color:white';
    document.body.appendChild(v);
  }
  v.style.display = 'flex';
  v.innerHTML = '<button onclick="document.getElementById(\'photoViewer\').style.display=\'none\'" style="position:absolute;top:25px;left:20px;color:white;background:none;border:0;font-size:32px">×</button><button onclick="movePhoto(-1)" style="position:absolute;left:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">‹</button><img src="'+photoFiles[photoIndex]+'" style="max-width:90%;max-height:80%;object-fit:contain"><button onclick="movePhoto(1)" style="position:absolute;right:8px;color:white;background:#3338;border:0;border-radius:50%;font-size:28px">›</button><div style="position:absolute;bottom:25px">'+(photoIndex+1)+' / '+photoFiles.length+'</div>';
  let startX = 0;
  v.ontouchstart = e => startX = e.touches[0].clientX;
  v.ontouchend = e => {
    let dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx)>50) movePhoto(dx<0?1:-1);
  };
}

function movePhoto(n){
  photoIndex = (photoIndex+n+photoFiles.length)%photoFiles.length;
  showPhoto();
}

    v = document.createElement('div');

    document.body.appendChild(v);
  }
  v.style.display = 'flex';

  v.ontouchstart = e => startX = e.touches[0].clientX;

window.igPosts = [

window.igPage = function(view, who) {
  const container = document.getElementById('igRoot');
  if (!container) return;

  const photos = window.igPosts;

  const iconStyle = 'width:23px;height:23px;display:block;';
  const homeIcon = `<svg style="${iconStyle}" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.8 12 3l9 7.8v9.7a.8.8 0 0 1-.8.8h-5.5v-6.2H9.3v6.2H3.8a.8.8 0 0 1-.8-.8z"/></svg>`;
  const reelsIcon = `<svg style="${iconStyle}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M8 3l4 5M15 3l4 5"/><path d="m10 11 5 3-5 3z" fill="currentColor" stroke="none"/></svg>`;
  const dmIcon = `<svg style="${iconStyle}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3 3 10.5l7 3.5 3.5 7z"/><path d="M10 14 21 3"/></svg>`;
  const searchIcon = `<svg style="${iconStyle}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg>`;
  const profileIcon = `<svg style="width:25px;height:25px;display:block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ddd"/><circle cx="12" cy="9" r="4" fill="#fff"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="#fff"/></svg>`;
  const heartIcon = `<svg style="width:23px;height:23px;display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.8 8.8c0 5-8.8 11-8.8 11s-8.8-6-8.8-11a4.6 4.6 0 0 1 8.8-1.6 4.6 4.6 0 0 1 8.8 1.6z"/></svg>`;

  const top = `
    <div style="height:43px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #f0f0f0">

      </div>
    </div>`;

  const bottom = `

      <span onclick="igPage('reels')" style="cursor:pointer;display:flex">${reelsIcon}</span>
      <span onclick="igPage('dm')" style="cursor:pointer;display:flex">${dmIcon}</span>
      <span onclick="igPage('search')" style="cursor:pointer;display:flex">${searchIcon}</span>
      <span onclick="igPage('profile')" style="cursor:pointer;display:flex">${profileIcon}</span>
    </div>`;

  let body = '';

  if (view === 'profile') {
    body = `
      <div style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:700">

        <span onclick="igPage('dm')" style="font-size:20px;cursor:pointer">☰</span>
      </div>
      <div style="display:flex;align-items:center;gap:18px;padding:12px 14px 16px">
        <div style="width:70px;height:70px;flex-shrink:0;border-radius:50%;background:#eef0f5;display:grid;place-items:center">
          <svg width="50" height="50" viewBox="0 0 24 24" fill="#fff">
            <circle cx="12" cy="8" r="4.5"/>
            <path d="M3 22v-2a9 9 0 0 1 18 0v2z"/>
          </svg>
        </div>
        <div style="display:flex;flex:1;justify-content:space-around;text-align:center;gap:8px">
          <div><b style="font-size:18px">${photos.length}</b><div style="font-size:12px;margin-top:2px">게시물</div></div>
          <div><b style="font-size:18px">913</b><div style="font-size:12px;margin-top:2px">팔로워</div></div>
          <div><b style="font-size:18px">96</b><div style="font-size:12px;margin-top:2px">팔로잉</div></div>
        </div>
      </div>

         '<span style="color:#aaa;font-size:22px">›</span></div>' +

         '<div style="margin-top:22px;display:flex;align-items:center;gap:14px;padding:12px;background:#f4f4f4;border-radius:14px;cursor:pointer" onclick="document.getElementById(\'album629\').style.display=\'block\'">' +

function updateClock(){
  const now=new Date();
  let hours=now.getHours()%12;
  if(hours===0)hours=12;
  const time=hours+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=time;
  document.getElementById('statusTime').textContent=time;
  document.getElementById('date').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
updateClock();
setInterval(updateClock,30000);
</script>
