<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Virtual Interface</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #0b0b0e;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen select-none">

    <!-- 전체 래퍼 (외부 뒤로가기 버튼 + 아이폰 프레임) -->
    <div class="relative flex items-center justify-center scale-95 md:scale-100">

        <!-- 왼쪽 상단 원형 '<' 뒤로 가기 버튼 -->
        <button onclick="goHome()" class="absolute -left-20 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/20 hover:bg-white/40 backdrop-blur-md rounded-full shadow-lg flex items-center justify-center text-white font-bold text-xl transition-all duration-200 border border-white/30 cursor-pointer z-50 group" title="홈으로">
            <span class="group-hover:-translate-x-0.5 transition-transform">&lt;</span>
        </button>

        <!-- 아이폰 기기 프레임 (세로 길이 대폭 축소) -->
        <div class="relative w-[340px] h-[700px] bg-black rounded-[48px] shadow-[0_20px_50px_rgba(0,0,0,0.6)] overflow-hidden border-[10px] border-gray-800 flex flex-col">
            
            <!-- 아이폰 상단바 (Dynamic Island & 상태표시줄) -->
            <div class="absolute top-0 left-0 right-0 h-10 bg-transparent z-40 flex justify-between items-center px-6 text-white text-[11px] font-semibold select-none pointer-events-none">
                <span id="status-time" class="tracking-tight">9:41</span>
                <!-- 다이내믹 아일랜드 -->
                <div class="absolute left-1/2 -translate-x-1/2 top-2 w-[90px] h-[22px] bg-black rounded-full flex items-center justify-between px-2">
                    <div class="w-2 h-2 rounded-full bg-[#111] border border-gray-800"></div>
                    <div class="w-2 h-2 rounded-full bg-[#050505]"></div>
                </div>
                <div class="flex items-center space-x-1">
                    <!-- 신호 -->
                    <svg class="w-3 h-3 fill-white" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h15.3l-.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.66-.58 3.19-1.55 4.41L12 11.83 6.55 16.41C5.58 15.19 5 13.66 5 12c0-3.87 3.13-7 7-7z"/></svg>
                    <!-- 와이파이 -->
                    <svg class="w-3 h-3 fill-white" viewBox="0 0 24 24"><path d="M12 3C6.95 3 3.15 4.85 0 7.23L12 22 24 7.23C20.85 4.85 17.05 3 12 3zm0 3.2c3.8 0 7.15 1.3 9.9 3.48L12 18.25 2.1 9.68C4.85 7.5 8.2 6.2 12 6.2z"/></svg>
                    <!-- 배터리 -->
                    <div class="w-5 h-2.5 border border-white rounded-[3px] p-0.5 flex items-center">
                        <div class="h-full w-full bg-white rounded-[1px]"></div>
                    </div>
                </div>
            </div>

            <!-- 화면 콘텐츠 영역 -->
            <div id="screen-container" class="relative w-full h-full flex flex-col overflow-hidden bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop');">
                
                <!-- 0. 잠금 화면 (Lock Screen) -->
                <div id="view-lock" class="absolute inset-0 z-30 flex flex-col items-center justify-between pt-14 pb-6 px-6 text-white bg-black/25 backdrop-blur-[2px] transition-transform duration-500">
                    <div class="flex flex-col items-center mt-6">
                        <svg class="w-5 h-5 mb-1.5 text-white/90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <div class="text-4xl font-light tracking-tight" id="lock-time">9:41</div>
                        <div class="text-xs font-medium mt-1 text-white/90" id="lock-date">10월 26일 월요일</div>
                    </div>
                    <!-- 위로 쓸어올려 잠금해제 -->
                    <div id="swipe-to-unlock" class="w-full flex flex-col items-center cursor-pointer pb-2 group">
                        <div class="text-[11px] tracking-wide text-white/80 font-medium group-hover:translate-y-[-2px] transition-transform">위로 쓸어올려 잠금 해제</div>
                        <div class="w-28 h-1 bg-white/60 rounded-full mt-2.5"></div>
                    </div>
                </div>

                <!-- 1. 홈 화면 (Home Screen) - 요청하신 4가지 앱 + 하단 독바 4가지 정확히 반영 -->
                <div id="view-home" class="absolute inset-0 flex flex-col justify-between pt-12 pb-3 px-5 z-10 opacity-0 pointer-events-none transition-opacity duration-300">
                    <!-- 상단 앱 아이콘 그리드 (인스타그램, 시계, 캘린더, 메모) -->
                    <div class="grid grid-cols-4 gap-3 pt-2">
                        <!-- Instagram -->
                        <div onclick="openApp('instagram')" class="flex flex-col items-center cursor-pointer group">
                            <div class="w-13 h-13 w-14 h-14 rounded-[16px] bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 shadow-md flex items-center justify-center text-white group-active:scale-95 transition-transform">
                                <svg class="w-7 h-7 fill-white" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                            </div>
                            <span class="text-white text-[10px] mt-1 drop-shadow font-medium">Instagram</span>
                        </div>
                        <!-- 시계 (iOS 시계 아이콘 감성) -->
                        <div onclick="openApp('clock')" class="flex flex-col items-center cursor-pointer group">
                            <div class="w-14 h-14 rounded-[16px] bg-black shadow-md flex flex-col items-center justify-center text-white border border-gray-800 group-active:scale-95 transition-transform relative overflow-hidden">
                                <div class="absolute top-1 w-0.5 h-2 bg-gray-400"></div>
                                <div class="absolute bottom-1 w-0.5 h-2 bg-gray-400"></div>
                                <span class="text-lg font-light tracking-tighter" id="clock-icon-time">9:41</span>
                            </div>
                            <span class="text-white text-[10px] mt-1 drop-shadow font-medium">시계</span>
                        </div>
                        <!-- 캘린더 (iOS 캘린더 아이콘 감성) -->
                        <div onclick="openApp('calendar')" class="flex flex-col items-center cursor-pointer group">
                            <div class="w-14 h-14 rounded-[16px] bg-white shadow-md flex flex-col items-center justify-center text-black group-active:scale-95 transition-transform overflow-hidden border border-gray-200">
                                <div class="w-full bg-red-500 text-white text-[8px] font-bold text-center py-0.5 uppercase" id="cal-month">OCT</div>
                                <div class="flex-1 flex items-center justify-center text-xl font-bold leading-none text-gray-900" id="cal-date">26</div>
                            </div>
                            <span class="text-white text-[10px] mt-1 drop-shadow font-medium">캘린더</span>
                        </div>
                        <!-- 메모 (iOS 메모 아이콘 감성) -->
                        <div onclick="openApp('notes')" class="flex flex-col items-center cursor-pointer group">
                            <div class="w-14 h-14 rounded-[16px] bg-[#fff9c4] shadow-md flex flex-col p-2 justify-between border border-yellow-200 group-active:scale-95 transition-transform relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-3 h-3 bg-yellow-300 shadow-sm"></div>
                                <div class="w-full h-1 bg-yellow-400 rounded-full mt-1"></div>
                                <div class="w-3/4 h-1 bg-yellow-400/60 rounded-full"></div>
                                <div class="w-1/2 h-1 bg-yellow-400/60 rounded-full"></div>
                            </div>
                            <span class="text-white text-[10px] mt-1 drop-shadow font-medium">메모</span>
                        </div>
                    </div>

                    <!-- 하단 독바 (Dock): 전화, 메시지, 사진, 카카오톡 -->
                    <div class="w-full bg-white/20 backdrop-blur-xl rounded-[24px] p-2 flex justify-around items-center shadow-lg mb-1">
                        <!-- 전화 (iOS 전화 아이콘) -->
                        <div onclick="openApp('phone')" class="w-11 h-11 rounded-[14px] bg-[#34c759] flex items-center justify-center text-white shadow-md cursor-pointer active:scale-95 transition-transform">
                            <svg class="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        </div>
                        <!-- 메시지 (iOS 메시지 아이콘) -->
                        <div onclick="openApp('messages')" class="w-11 h-11 rounded-[14px] bg-[#007aff] flex items-center justify-center text-white shadow-md cursor-pointer active:scale-95 transition-transform">
                            <svg class="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                        </div>
                        <!-- 사진 (iOS 사진 아이콘) -->
                        <div onclick="openApp('photos')" class="w-11 h-11 rounded-[14px] bg-white flex items-center justify-center shadow-md cursor-pointer active:scale-95 transition-transform overflow-hidden">
                            <div class="grid grid-cols-2 gap-0.5 w-full h-full p-1 bg-gray-50">
                                <div class="bg-rose-400 rounded-sm"></div>
                                <div class="bg-amber-400 rounded-sm"></div>
                                <div class="bg-emerald-400 rounded-sm"></div>
                                <div class="bg-blue-400 rounded-sm"></div>
                            </div>
                        </div>
                        <!-- 카카오톡 -->
                        <div onclick="openApp('kakaotalk')" class="w-11 h-11 rounded-[14px] bg-[#fee500] flex items-center justify-center text-[#3c1e1e] font-bold shadow-md cursor-pointer active:scale-95 transition-transform text-sm">
                            💬
                        </div>
                    </div>
                </div>

                <!-- 2. 각 앱 실행 화면 컨테이너 -->
                <div id="view-app" class="absolute inset-0 bg-white z-20 flex flex-col opacity-0 pointer-events-none transition-opacity duration-300">
                    <!-- 앱 내부 헤더 -->
                    <div class="h-12 bg-gray-50/90 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-4 pt-3 shrink-0">
                        <button onclick="goHome()" class="text-blue-600 font-medium text-sm flex items-center cursor-pointer py-1">
                            <span class="text-base mr-1 font-bold">&lt;</span> 홈
                        </button>
                        <span id="app-title" class="font-bold text-gray-800 text-xs">앱 이름</span>
                        <div class="w-10"></div>
                    </div>
                    <!-- 앱 바디 -->
                    <div id="app-content" class="flex-1 overflow-y-auto no-scrollbar bg-gray-50 p-3">
                        <!-- 콘텐츠 영역 -->
                    </div>
                </div>

                <!-- 아이폰 하단 홈 인디케이터 바 -->
                <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-28 h-1 bg-white/60 rounded-full z-40 pointer-events-none"></div>

            </div>
        </div>
    </div>

    <script>
        // 시계 및 날짜 업데이트
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12;
            const timeStr = `${hours}:${minutes}`;
            
            document.getElementById('status-time').innerText = timeStr;
            const lockTime = document.getElementById('lock-time');
            if(lockTime) lockTime.innerText = timeStr;
            const clockIconTime = document.getElementById('clock-icon-time');
            if(clockIconTime) clockIconTime.innerText = timeStr;

            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const lockDate = document.getElementById('lock-date');
            if(lockDate) lockDate.innerText = `${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}`;

            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            document.getElementById('cal-month').innerText = months[now.getMonth()];
            document.getElementById('cal-date').innerText = now.getDate();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 잠금해제 제스처
        document.getElementById('swipe-to-unlock').addEventListener('click', function() {
            const lockView = document.getElementById('view-lock');
            const homeView = document.getElementById('view-home');

            lockView.style.transform = 'translateY(-100%)';
            setTimeout(() => {
                lockView.classList.add('hidden');
                homeView.classList.remove('opacity-0', 'pointer-events-none');
            }, 300);
        });

        // 앱 열기
        function openApp(appName) {
            const homeView = document.getElementById('view-home');
            const appView = document.getElementById('view-app');
            const appTitle = document.getElementById('app-title');
            const appContent = document.getElementById('app-content');

            homeView.classList.add('opacity-0', 'pointer-events-none');
            appView.classList.remove('opacity-0', 'pointer-events-none');

            if (appName === 'instagram') {
                appTitle.innerText = 'Instagram';
                appContent.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2.5 pb-2 border-b border-gray-100">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-purple-600 p-0.5">
                                <div class="w-full h-full bg-white rounded-full flex items-center justify-center font-bold text-[10px]">김</div>
                            </div>
                            <span class="font-bold text-xs">sunwoo_kim</span>
                        </div>
                        <div class="bg-gray-200 h-56 rounded-xl flex items-center justify-center text-gray-500 font-medium bg-cover bg-center shadow-sm" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=600&auto=format&fit=crop');"></div>
                        <div class="text-[11px] text-gray-700 leading-relaxed"><span class="font-bold">sunwoo_kim</span> 아이폰 UI 컴팩트 버전 적용 완료 📱✨</div>
                    </div>
                `;
            } else if (appName === 'clock') {
                appTitle.innerText = '시계';
                appContent.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center">
                        <div class="text-4xl font-light text-gray-900 mb-1">09:41</div>
                        <div class="text-gray-500 text-[11px]">알람 및 세계 시각</div>
                    </div>
                `;
            } else if (appName === 'calendar') {
                appTitle.innerText = '캘린더';
                appContent.innerHTML = `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 text-center">
                        <h3 class="font-bold text-sm mb-2 text-rose-500">2026년 10월</h3>
                        <div class="grid grid-cols-7 gap-1 text-[10px] font-semibold text-gray-400 mb-1">
                            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-xs">
                            <span class="text-gray-300">27</span><span class="text-gray-300">28</span><span class="text-gray-300">29</span><span class="text-gray-300">30</span><span>1</span><span>2</span><span>3</span>
                            <span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                            <span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
                            <span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span>
                            <span>25</span><span class="bg-blue-500 text-white rounded-full w-5 h-5 flex items-center justify-center mx-auto font-bold text-[10px]">26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
                        </div>
                    </div>
                `;
            } else if (appName === 'notes') {
                appTitle.innerText = '메모';
                appContent.innerHTML = `
                    <div class="space-y-2">
                        <div class="bg-amber-50 p-3 rounded-xl border border-amber-100 shadow-sm">
                            <h4 class="font-bold text-amber-900 text-xs mb-1">체크리스트</h4>
                            <p class="text-[10px] text-amber-800 leading-relaxed">1. 세로 화면 비율 축소 완료<br>2. iOS 오리지널 아이콘 적용 완료</p>
                        </div>
                    </div>
                `;
            } else if (appName === 'phone') {
                appTitle.innerText = '전화';
                appContent.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full">
                        <div class="text-lg font-bold mb-3 tracking-widest text-gray-800">010-1234-5678</div>
                        <div class="grid grid-cols-3 gap-2.5 mb-3">
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">1</div>
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">2</div>
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">3</div>
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">4</div>
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">5</div>
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-base font-bold text-gray-700">6</div>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-[#34c759] flex items-center justify-center text-white text-lg shadow-md">📞</div>
                    </div>
                `;
            } else if (appName === 'messages') {
                appTitle.innerText = '메시지';
                appContent.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex items-center space-x-2.5 p-2.5 bg-white rounded-xl shadow-sm border border-gray-100">
                            <div class="w-8 h-8 rounded-full bg-[#007aff] text-white flex items-center justify-center font-bold text-xs">김</div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center"><span class="font-bold text-xs">시스템 알림</span><span class="text-[9px] text-gray-400">오후 9:08</span></div>
                                <p class="text-[10px] text-gray-600 truncate">아이폰 규격 및 아이콘이 수정되었습니다.</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (appName === 'photos') {
                appTitle.innerText = '사진';
                appContent.innerHTML = `
                    <div class="grid grid-cols-3 gap-1">
                        <div class="aspect-square bg-cover bg-center rounded-sm" style="background-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=300&auto=format&fit=crop');"></div>
                        <div class="aspect-square bg-cover bg-center rounded-sm" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=300&auto=format&fit=crop');"></div>
                        <div class="aspect-square bg-cover bg-center rounded-sm" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=300&auto=format&fit=crop');"></div>
                    </div>
                `;
            } else if (appName === 'kakaotalk') {
                appTitle.innerText = '카카오톡';
                appContent.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex items-center space-x-2.5 p-2.5 bg-white rounded-xl shadow-sm border border-gray-100">
                            <div class="w-9 h-9 rounded-2xl bg-[#fee500] flex items-center justify-center text-sm font-bold shadow-sm">💬</div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center"><span class="font-bold text-xs">개발 톡방</span><span class="text-[9px] text-gray-400">오후 9:10</span></div>
                                <p class="text-[10px] text-gray-600 truncate">컴팩트한 아이폰 화면 완성!</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 홈으로 가기
        function goHome() {
            const homeView = document.getElementById('view-home');
            const appView = document.getElementById('view-app');

            homeView.classList.remove('opacity-0', 'pointer-events-none');
            appView.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
